<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gallery - Department of Physics - Vikram Dev University, Jayapur</title>
<meta name="description" content="Photo gallery of the Department of Physics, Vikram Dev University, Jayapur.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:wght@400;500;600;700&family=Source+Sans+3:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="styles.css?v=20261122">
</head>
<body>
<div id="site-header"></div>
<script src="data.js?v=20261122"></script>
<script src="layout.js?v=20261122"></script>
<main id="top">
<section id="gallery" style="padding:56px 0;border-top:1px solid #ddd6c4;">
    <div style="max-width:1140px;margin:0 auto;padding:0 24px;">
      <div style="max-width:56ch;margin-bottom:32px;">
        <div style="color:#b8862e;font-weight:600;font-size:14px;margin-bottom:8px;">Around the department</div>
        <h2 style="font-size:clamp(26px,3.4vw,36px);">Gallery</h2>
        <p style="color:#5b6472;font-size:17px;">A slide for each photo, with its own caption.</p>
      </div>
      <div style="position:relative;">
        <div style="overflow:hidden;border:1px solid #ddd6c4;background:#fbf9f3;">
          <div id="slideStrip" style="display:flex;transition:transform 0.35s ease;">
            <div id="slideItems" style="display:contents"></div>
          </div>
        </div>
        <button id="prevSlide" aria-label="Previous slide" style="position:absolute;left:-18px;top:40%;background:#141d33;color:#fff;border:none;width:36px;height:36px;border-radius:50%;font-size:18px;cursor:pointer;">‹</button>
        <button id="nextSlide" aria-label="Next slide" style="position:absolute;right:-18px;top:40%;background:#141d33;color:#fff;border:none;width:36px;height:36px;border-radius:50%;font-size:18px;cursor:pointer;">›</button>
        <div style="display:flex;justify-content:center;gap:8px;margin-top:16px;">
          <div id="slideDots" style="display:contents"></div>
        </div>
      </div>
    </div>
  </section>

</main>
<div id="site-footer"></div>
<script src="facultyData.js?v=20261122"></script>
<script src="resources.js?v=20261122"></script>
<script src="script.js?v=20261122"></script>
</body>
</html>
